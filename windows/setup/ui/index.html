<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>USB-C Display Setup</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="scenes.css">
</head>
<body>
<div id="app">
  <header class="titlebar">
    <svg class="app-icon" viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="tbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8cff"/><stop offset="1" stop-color="#7b5cf0"/></linearGradient></defs><rect x="1" y="1" width="30" height="30" rx="7.5" fill="url(#tbg)"/><rect x="5.5" y="8" width="11" height="8" rx="1.6" fill="#fff"/><rect x="18" y="10" width="8.5" height="6.5" rx="1.4" fill="#fff" fill-opacity=".85"/><path d="M11 16v3.2c0 1.8 1.2 2.8 3 2.8h5.2c1.8 0 3-1 3-2.8v-2.7" stroke="#fff" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg>
    <div class="app-name">USB-C Display<span>Setup</span></div>
    <div class="spacer"></div>
    <button class="caption" data-act="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" stroke-width="1"/></svg></button>
    <button class="caption close" data-act="close" title="Close. You can finish setup later." aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" stroke-width="1"/></svg></button>
  </header>
  <nav class="rail" id="rail" aria-label="Setup steps"></nav>
  <main class="main">
    <div class="content" id="content">
      <div class="head" id="r-head"></div>
      <div class="col">
        <div class="top" id="r-top" hidden></div>
        <div class="stage" id="stage" aria-hidden="true"><div class="scene-wrap"><div class="scene" id="scene"></div></div></div>
        <div id="r-sub" hidden></div>
        <div class="below" id="r-below" hidden></div>
      </div>
      <aside class="aside" id="r-aside" hidden></aside>
    </div>
    <div class="footer" id="r-footer"></div>
  </main>
</div>
<script src="scenes.js"></script>
<script src="steps.js"></script>
<script src="app.js"></script>
</body>
</html>
