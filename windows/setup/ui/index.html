<!doctype html>
<html lang="en" data-theme="light" data-accent="blue">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'">
<title>USB-C Display Setup</title>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="scenes.css">
<link rel="stylesheet" href="macos.css">
</head>
<body>
<!-- One Mac window (OnBoardingKit style), on Windows too: 800 x 600 pt, 16 pt continuous corners, a
     transparent 32 pt title band with the traffic lights and no title. The Mac's copy of this window
     (the handover) is the same page, drawn from the mirrored state, so nothing changes at the cut. -->
<div id="app" class="win">
  <div class="lights" id="lights">
    <button class="tl close" data-act="close" aria-label="Close" tabindex="-1"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M4.6 4.6l4.8 4.8M9.4 4.6l-4.8 4.8"/></svg></button>
    <button class="tl min" data-act="minimize" aria-label="Minimize" tabindex="-1"><svg viewBox="0 0 14 14" aria-hidden="true"><path d="M3.9 7h6.2"/></svg></button>
    <button class="tl zoom" disabled aria-hidden="true" tabindex="-1"><svg viewBox="0 0 14 14" aria-hidden="true"><path class="fill" d="M4.2 9.8V5.6l4.2 4.2zM9.8 4.2v4.2L5.6 4.2z"/></svg></button>
  </div>
  <main class="page" id="page"></main>
  <footer class="tray" id="tray">
    <div class="slot-left" id="slot"><div class="status" id="status" role="status" aria-live="polite"></div></div>
    <div class="buttons" id="buttons"></div>
  </footer>
  <div class="sheet-dim" id="sheet-dim" hidden></div><div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></div>
  <svg class="win-edge" id="win-edge" aria-hidden="true"><path class="hi"/><path class="out"/></svg>
</div>
<script src="strings.js"></script>
<script src="scenes.js"></script>
<script src="macos.js"></script>
<script src="steps.js"></script>
<script src="app.js"></script>
</body>
</html>
